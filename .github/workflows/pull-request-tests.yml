name: WHJ Pull Request Tests

on:
  pull_request:
    branches: [main, strategy/qualified-forward-paper-20261111]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whj-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m py_compile *.py
