name: Publish WHJ QuantumOrb neural command center

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-dual-dashboard.yml"
      - "web/index.html"
      - "dual_portfolio.json"
      - "report.json"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout QuantumOrb dashboard source
        uses: actions/checkout@v4
        with:
          ref: main
          path: dashboard-source
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble QuantumOrb site
        run: |
          mkdir -p _site
          cp dashboard-source/web/index.html _site/index.html
          cp dashboard-source/dual_portfolio.json _site/dual_portfolio.json
          if [ -f dashboard-source/report.json ]; then cp dashboard-source/report.json _site/report.json; fi
          if [ -d dashboard-source/data ]; then cp -R dashboard-source/data _site/data; fi
          touch _site/.nojekyll
      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy QuantumOrb dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
