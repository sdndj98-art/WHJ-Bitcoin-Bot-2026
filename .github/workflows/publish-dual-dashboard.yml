name: Publish WHJ QuantumOrb neural command center

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-dual-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuantumOrb dashboard source
        uses: actions/checkout@v4
        with:
          ref: feature/quantumorb-living-motion-20261110
          path: dashboard-source
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble QuantumOrb site
        run: |
          mkdir -p _site
          cp dashboard-source/web/index.html _site/index.html
          cp dashboard-source/dual_portfolio.json _site/dual_portfolio.json
          touch _site/.nojekyll
      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy QuantumOrb dashboard
        id: deployment
        uses: actions/deploy-pages@v4

# Portfolio snapshot source is maintained alongside the QuantumOrb dashboard.
# Keep the portfolio panel inside the main content flow for mobile visibility.

# Rebuild Pages when the QuantumOrb portfolio panel is repositioned on its source branch.
