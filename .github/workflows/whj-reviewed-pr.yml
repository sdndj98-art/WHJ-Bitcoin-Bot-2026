name: WHJ Reviewed Proposal Pull Request

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: "Existing proposal branch; must start with whj-proposal/"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: whj-reviewed-pr-${{ inputs.head_branch }}
  cancel-in-progress: false

jobs:
  open-draft-pr:
    name: Validate proposal and open draft PR
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          HEAD_BRANCH: ${{ inputs.head_branch }}
        run: |
          case "$HEAD_BRANCH" in
            whj-proposal/*) ;;
            *) echo "Rejected: branch must start with whj-proposal/"; exit 1 ;;
          esac
          if [ "$HEAD_BRANCH" = "whj-proposal/" ]; then
            echo "Rejected: branch name is incomplete"
            exit 1
          fi

      - name: Checkout main and fetch proposal
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate changes are not in protected trading/dashboard files
        env:
          HEAD_BRANCH: ${{ inputs.head_branch }}
        run: |
          git fetch origin "$HEAD_BRANCH"
          git merge-base origin/main "origin/$HEAD_BRANCH" >/dev/null
          git diff --name-only "origin/main...origin/$HEAD_BRANCH" > changed-files.txt
          cat changed-files.txt
          if [ ! -s changed-files.txt ]; then
            echo "Rejected: proposal branch has no changes"
            exit 1
          fi
          if grep -E '^(index\\.html|dual_portfolio\\.json|paper_account\\.py|whj_agents\\.py|btc_paper_runner\\.py|gold_paper_runner\\.py|.*paper.*ledger.*)$' changed-files.txt; then
            echo "Rejected: proposal touches protected dashboard or trading-safety files"
            exit 1
          fi

      - name: Open draft pull request (never merge)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
        run: |
          existing=$(gh pr list --base main --head "$HEAD_BRANCH" --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "An open pull request already exists for this branch."
            exit 0
          fi
          title="WHJ proposal: ${HEAD_BRANCH#whj-proposal/}"
          gh pr create --draft --base main --head "$HEAD_BRANCH" --title "$title" --body "Draft for human review only. Dashboard and protected trading files are blocked. Run all tests and review the diff before approval. No automatic merge. Paper Trading only; live trading must remain disabled."
