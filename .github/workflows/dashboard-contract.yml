name: WHJ Dashboard Contract

on:
  push:
    branches: [feature/efficiency-ratio-indicator]
    paths:
      - "web/index.html"
      - "dashboard.py"
      - "tests/test_dashboard_contract.py"
      - ".github/workflows/dashboard-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/index.html"
      - "dashboard.py"
      - "tests/test_dashboard_contract.py"
      - ".github/workflows/dashboard-contract.yml"

permissions:
  contents: read

concurrency:
  group: whj-dashboard-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dashboard-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dashboard contract and regression tests
        run: python -m unittest discover -s tests -p 'test_dashboard_contract.py' -v
