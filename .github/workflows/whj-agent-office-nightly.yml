name: WHJ AI Research Office Nightly Plan

on:
  workflow_dispatch:
  push:
    branches: [research/global-evidence-strategy-lab-20261112]
    paths:
      - "whj_agent_office.py"
      - "whj_grok_worker.py"
      - "whj_free_worker.py"
      - "tests/test_whj_free_worker.py"
      - "tests/test_whj_agent_office.py"
      - "tests/test_whj_grok_worker.py"
      - ".github/workflows/whj-agent-office-nightly.yml"
  schedule:
    - cron: "0 22,2,6,10,14,18 * * *"

permissions:
  contents: read

concurrency:
  group: whj-agent-office-nightly
  cancel-in-progress: false

jobs:
  build-office-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/global-evidence-strategy-lab-20261112
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate agent-office governance
        run: |
          python -m unittest discover -s tests -p 'test_whj_agent_office.py' -v
          python -m unittest discover -s tests -p 'test_whj_grok_worker.py' -v
          python -m unittest discover -s tests -p 'test_whj_free_worker.py' -v
      - name: Generate nightly research work plan
        run: python whj_agent_office.py plan --output-dir research/agent_office
      - name: Run free deterministic workers (always on)
        run: python whj_free_worker.py run --output-dir research/agent_office
      - name: Run Grok workers only when explicitly enabled
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          WHJ_AGENT_AUTORUN: ${{ vars.WHJ_AGENT_AUTORUN }}
          WHJ_AGENT_BUDGET_USD: "0.50"
        run: |
          if [ "$WHJ_AGENT_AUTORUN" = "true" ] && [ -n "$XAI_API_KEY" ]; then
            python whj_grok_worker.py run --budget-usd "$WHJ_AGENT_BUDGET_USD"
          else
            echo "Grok execution disabled: explicit repository variable and API secret are both required."
          fi
      - name: Upload nightly office outputs
        uses: actions/upload-artifact@v4
        with:
          name: whj-agent-office-${{ github.run_number }}
          path: |
            research/agent_office/latest_plan.json
            research/agent_office/latest_plan.md
            research/agent_office/latest_free_worker_results.json
            research/agent_office/latest_free_worker_results.md
            research/agent_office/runs/**
          if-no-files-found: error
          retention-days: 30
