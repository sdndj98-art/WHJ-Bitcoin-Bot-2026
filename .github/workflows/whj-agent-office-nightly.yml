name: WHJ AI Research Office Nightly Plan

on:
  workflow_dispatch:
  push:
    branches: [main, research/global-evidence-strategy-lab-20261112]
    paths:
      - "whj_agent_office.py"
      - "whj_agents.py"
      - "whj_grok_worker.py"
      - "whj_free_worker.py"
      - "whj_24h_development_team.py"
      - "whj_repair_advisor.py"
      - "whj_evidence_verifier.py"
      - "shared_paper_runner.py"
      - "shared_paper_portfolio.py"
      - "paper_account.py"
      - "market_scanner.py"
      - "multi_market_opportunity_scan.py"
      - "gold_paper_runner.py"
      - "tests/test_whj_free_worker.py"
      - "tests/test_whj_agent_office.py"
      - "tests/test_whj_grok_worker.py"
      - "tests/test_whj_evidence_verifier.py"
      - "tests/test_whj_agents.py"
      - "tests/test_shared_paper_runner.py"
      - "tests/test_shared_paper_portfolio.py"
      - "dual_portfolio.json"
      - ".github/workflows/whj-agent-office-nightly.yml"
  schedule:
    # 12 scheduled cycles per day (every 2 hours, UTC).
    # Push-triggered kickoff: run the research office after this workflow is updated.
    - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  group: whj-agent-office-nightly
  cancel-in-progress: false

jobs:
  build-office-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate agent-office governance
        run: |
          python -m unittest discover -s tests -p 'test_whj_agent_office.py' -v
          python -m unittest discover -s tests -p 'test_whj_grok_worker.py' -v
          python -m unittest discover -s tests -p 'test_whj_evidence_verifier.py' -v
          python -m unittest discover -s tests -p 'test_whj_free_worker.py' -v
      - name: Generate research-office work plan
        run: python whj_agent_office.py plan --output-dir research/agent_office
      - name: Generate six-agent paper status when portfolio snapshot exists
        run: |
          if [ -f dual_portfolio.json ]; then
            python -m py_compile whj_agents.py
            python whj_agents.py --input dual_portfolio.json --output research/agent_office/latest_paper_agents.json
          else
            echo "No dual portfolio snapshot on main; paper status marked unavailable."
            printf '{"status":"UNAVAILABLE","reason":"dual_portfolio.json missing on main","live_trading_enabled":false}\n' > research/agent_office/latest_paper_agents.json
          fi
      - name: Run free deterministic workers (always on)
        run: python whj_free_worker.py run --output-dir research/agent_office
      - name: Independently verify exact evidence quotes and source fingerprints
        run: python whj_evidence_verifier.py --root . --output-dir research/agent_office/evidence_verifier
      - name: Enforce free-only office mode
        run: |
          echo "FREE_ONLY=true"
          echo "No paid model provider is called. No API key or paid secret is read."
          echo "The office runs deterministic repository audits, validation, planning, and paper-status reporting only."
      - name: Upload office outputs
        uses: actions/upload-artifact@v4
        with:
          name: whj-agent-office-${{ github.run_number }}
          path: |
            research/agent_office/latest_plan.json
            research/agent_office/latest_plan.md
            research/agent_office/latest_free_worker_results.json
            research/agent_office/latest_free_worker_results.md
            research/agent_office/latest_paper_agents.json
            research/agent_office/evidence_verifier/
            research/agent_office/runs/**
          if-no-files-found: error
          retention-days: 30
