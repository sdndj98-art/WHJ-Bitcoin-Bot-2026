name: WHJ Forward Paper Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main, research/regime-aware-consensus-ensemble, strategy/qualified-forward-monitor-20261111]
    paths:
      - "forward_paper_monitor.py"
      - "qualified_forward_paper_monitor.py"
      - "paper_account.py"
      - "historical_research.py"
      - "tests/test_forward_paper_monitor.py"
      - "tests/test_qualified_forward_paper_monitor.py"
      - ".github/workflows/forward-paper-monitor.yml"

permissions:
  contents: read

concurrency:
  group: whj-forward-paper-monitor
  cancel-in-progress: false

jobs:
  forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore forward-only paper ledgers
        id: restore-paper-ledgers
        uses: actions/cache/restore@v4
        with:
          path: |
            paper_forward_1h_sma_trend.json
            paper_forward_1h_ema_trend.json
            paper_forward_1h_rsi14_mean_reversion.json
            paper_forward_4h_ema50_200.json
            paper_forward_6h_ema50_200.json
            research_runs/20261111_atr_forward_validation/paper_state/paper_qualified_1d_sma_trend.json
            research_runs/20261111_atr_forward_validation/paper_state/paper_qualified_6h_ema50_200_regime.json
            research_runs/20261111_atr_forward_validation/paper_state/paper_qualified_6h_ema_pullback_trend.json
            research_runs/20261111_atr_forward_validation/paper_state/paper_qualified_4h_ema20_50_daily_sma200_atr3.json
          key: whj-forward-paper-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whj-forward-paper-v1-
      - name: Guard against missing paper ledger cache
        if: steps.restore-paper-ledgers.outputs.cache-matched-key == '' && github.run_number != '1'
        run: |
          echo "::error::Forward paper ledger cache is missing after initialization. Refusing to reseed accounts or erase forward history."
          exit 1
      - name: Run focused safety tests
        run: python -m unittest discover -s tests -p 'test_forward_paper_monitor.py' -v
      - name: Run forward-only paper monitor
        run: python forward_paper_monitor.py
      - name: Run four qualified candidate forward-only ledgers
        run: |
          python -m unittest discover -s tests -p 'test_qualified_forward_paper_monitor.py' -v
          python qualified_forward_paper_monitor.py
      - name: Save forward-only ledgers
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            paper_forward_1h_sma_trend.json
            paper_forward_1h_ema_trend.json
            paper_forward_1h_rsi14_mean_reversion.json
            paper_forward_4h_ema50_200.json
            paper_forward_6h_ema50_200.json
            research_runs/20261111_atr_forward_validation/paper_state/paper_qualified_1d_sma_trend.json
            research_runs/20261111_atr_forward_validation/paper_state/paper_qualified_6h_ema50_200_regime.json
            research_runs/20261111_atr_forward_validation/paper_state/paper_qualified_6h_ema_pullback_trend.json
            research_runs/20261111_atr_forward_validation/paper_state/paper_qualified_4h_ema20_50_daily_sma200_atr3.json
          key: whj-forward-paper-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish concise paper status to workflow summary
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("forward_paper_report.json").read_text(encoding="utf-8"))
          lines = [
              "## WHJ forward-only paper snapshot",
              "",
              f"- **Status:** {report['status']}",
              f"- **Generated (UTC):** {report['generated_at_utc']}",
              f"- **Market data:** {report['data_quality']['quality']}",
              f"- **Monitor cycle:** {report['cycle_status']} ({report['total_processed_new_candles']} new closed candles processed)",
              f"- **Historical imputed warm-up candles:** {report['data_quality']['imputed_hourly_candles']} / {report['data_quality']['total_hourly_candles']} ({report['data_quality']['imputed_hourly_pct']:.4f}%)",
              f"- **Combined simulated equity:** ${report['equity_after_estimated_exit_costs_usd']:.2f}",
              f"- **Combined return:** {report['return_pct']:.4f}%",
              f"- **Closed trades:** {report['completed_trades']}",
              "",
              "| Sleeve | Equity | Return | Trades | Max DD | Rolling status | Rolling DD | Rolling net | Health | Open position | Risk pauses |",
              "|---|---:|---:|---:|---:|---|---:|---:|---|---|---|",
          ]
          ensemble = report["qualified_ensemble"]
          lines += [
              "",
              "## Qualified 4h + 6h EMA50/EMA200 ensemble (paper only)",
              "",
              f"- **Ensemble status:** {ensemble['status']}",
              f"- **Equity:** ${ensemble['equity_after_estimated_exit_costs_usd']:.2f} / ${ensemble['initial_cash_usd']:.2f}",
              f"- **Return:** {ensemble['return_pct']:.4f}%",
              f"- **Closed trades:** {ensemble['completed_trades']}",
              f"- **New closed candles processed:** {ensemble['processed_new_candles']}",
              f"- **Sleeve drawdowns:** 4h {ensemble['max_drawdown_by_sleeve_pct']['4h']:.2f}% / 6h {ensemble['max_drawdown_by_sleeve_pct']['6h']:.2f}%",
              "- **Allocation:** 50% capital per timeframe; 10% of each sleeve per entry",
              "",
              "> The ensemble uses only the historically qualified 4h and 6h EMA50/EMA200 candidates. Both remain forward-only paper tests; historical qualification does not guarantee future profit.",
          ]
          for timeframe, item in report["sleeves_summary"].items():
              pauses = ", ".join(item["risk_pause_reasons"]) or "None"
              health = item.get("health_assessment") or {}
              rolling_dd = health.get("rolling_max_drawdown_pct")
              rolling_dd_text = f"{rolling_dd:.2f}%" if isinstance(rolling_dd, (int, float)) else "—"
              rolling_net = health.get("rolling_net_pnl_usd")
              rolling_net_text = f"${rolling_net:.2f}" if isinstance(rolling_net, (int, float)) else "—"
              lines.append(
                  f"| {timeframe} | ${item['equity_usd']:.2f} | {item['return_pct']:.2f}% | "
                  f"{item['completed_trades']} | {item['max_drawdown_pct']:.2f}% | "
                  f"{health.get('rolling_status', '—')} | {rolling_dd_text} | {rolling_net_text} | "
                  f"{health.get('status', '—')} | {item['open_position']} | {pauses} |"
              )
          lines += ["", "> Paper simulation only. No real orders. Historical warm-up candles do not create trades."]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Publish qualified candidate status
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("qualified_forward_paper_report.json").read_text(encoding="utf-8"))
          lines = [
              "",
              "## Four historically qualified candidates — forward-only paper",
              "",
              f"- **Status:** {report['status']}",
              f"- **Cycle:** {report['cycle_status']} ({report['total_processed_new_candles']} new native-timeframe bars)",
              f"- **Combined equity:** ${report['equity_usd']:.2f} / ${report['initial_cash_usd']:.2f} ({report['return_pct']:.4f}%)",
              f"- **Closed trades:** {report['completed_trades']}",
              "",
              "| Candidate | TF | Equity | Return | New bars | Closed trades | Max DD | Fees | Open | Risk pauses |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---|---|",
          ]
          for name, item in report["candidates"].items():
              pauses = ", ".join(item["risk_pause_reasons"]) or "None"
              lines.append(
                  f"| {name} | {item['timeframe_hours']}h | ${item['equity_usd']:.2f} | "
                  f"{item['return_pct']:.4f}% | {item['processed_new_candles']} | "
                  f"{item['completed_trades']} | {item['max_drawdown_pct']:.2f}% | "
                  f"${item['fees_paid_usd']:.4f} | {item['open_position']} | {pauses} |"
              )
          lines += [
              "",
              "> Independent $250 ledgers. Historical bars warm indicators only; synthetic bars cannot execute. Paper only, no live orders.",
          ]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Upload forward paper snapshot
        uses: actions/upload-artifact@v4
        with:
          name: whj-forward-paper-snapshot-${{ github.run_number }}
          path: |
            forward_paper_report.json
            qualified_forward_paper_report.json
          if-no-files-found: error
          retention-days: 30
