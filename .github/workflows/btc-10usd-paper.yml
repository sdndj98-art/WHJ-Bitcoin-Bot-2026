name: WHJ Shared $100 Seven-Strategy Paper Portfolio
# Paper-only workflow: shared simulated $100 ledger; no live orders.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "shared_paper_runner.py"
      - "shared_paper_portfolio.py"
      - "multi_asset_paper_runner.py"
      - "metal_price_sources.py"
      - "multi_market_opportunity_scan.py"
      - "tests/test_multi_asset_paper_runner.py"
      - "whj_agents.py"
      - "office/paper_bridge.py"
      - "historical_research.py"
      - "forward_paper_monitor.py"
      - "dual_portfolio.json"
      - "web/**"
      - "dual_portfolio_dashboard.html"
      - "tests/**"
      - ".github/workflows/btc-10usd-paper.yml"
permissions:
  contents: read
concurrency:
  group: whj-shared-100usd-paper
  cancel-in-progress: false
jobs:
  shared-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore shared $100 paper ledger
        id: restore-shared-ledger
        uses: actions/cache/restore@v4
        with:
          path: state/shared_paper_100usd.json
          key: whj-shared100-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whj-shared100-ledger-
      - name: Refuse silent shared-ledger reset
        run: |
          if [ -f state/shared_paper_initialized.json ] && [ ! -f state/shared_paper_100usd.json ]; then
            echo "::error::Shared $100 ledger cache is missing; refusing to recreate or reset capital."
            exit 1
          fi
      - name: Compile and run complete test suite
        run: |
          python -m py_compile shared_paper_runner.py shared_paper_portfolio.py multi_asset_paper_runner.py multi_market_opportunity_scan.py metal_price_sources.py historical_research.py forward_paper_monitor.py whj_agents.py
          python -m unittest discover -s tests -v
      - name: Run seven BTC strategies against the one shared paper wallet
        run: python shared_paper_runner.py
      - name: Run top liquid USD crypto pairs and gold/silver through the same paper wallet
        run: python multi_asset_paper_runner.py
      - name: Refresh existing dashboard report from the shared wallet
        continue-on-error: true
        run: python main.py
      - name: Run six-agent decision office
        run: |
          python -m py_compile whj_agents.py
          python -m unittest discover -s tests -p 'test_whj_agents.py' -v
          python whj_agents.py --input dual_portfolio.json --output state/whj_agents.json
      - name: Connect office to the completed paper-engine outputs
        run: python office/paper_bridge.py
      - name: Confirm ledger and record first initialization
        run: |
          test -s state/shared_paper_100usd.json
          python - <<'PY'
          import json
          from pathlib import Path
          marker = Path("state/shared_paper_initialized.json")
          if not marker.exists():
              marker.write_text(json.dumps({
                  "schema_version": 1,
                  "initial_capital_usd": 100.0,
                  "paper_only": True,
                  "ledger": "state/shared_paper_100usd.json"
              }, indent=2), encoding="utf-8")
          PY
      - name: Save shared paper ledger cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state/shared_paper_100usd.json
          key: whj-shared100-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Persist dashboard snapshot and initialization marker
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dual_portfolio.json
          git add -f state/shared_paper_initialized.json
          git add -f state/whj_agents.json
          git add office/paper_bridge_report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update shared $100 paper portfolio snapshot"
            # Concurrent code and dashboard commits can land while this paper
            # run is finishing. Rebase the generated snapshot on current main
            # and prefer this run's generated report files if they conflict.
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
      - name: Assemble existing WHJ dashboard
        if: success()
        run: |
          mkdir -p _site/state
          # Publish all existing WHJ pages without changing their visual layout.
          cp web/*.html _site/
          cp web/index.html _site/index.html
          cp dual_portfolio_dashboard.html _site/dual_portfolio_dashboard.html
          cp dual_portfolio.json _site/dual_portfolio.json
          cp state/whj_agents.json _site/whj_agents.json
          mkdir -p _site/office
          cp office/paper_bridge_report.json _site/office/paper_bridge_report.json
          # The paper-trades page needs its live paper ledger and report under ./state/.
          cp state/shared_paper_100usd.json _site/state/shared_paper_100usd.json
          if [ -s report.json ]; then cp report.json _site/report.json; fi
          if [ -s state/multi_asset_paper_report.json ]; then
            cp state/multi_asset_paper_report.json _site/multi_asset_paper_report.json
            cp state/multi_asset_paper_report.json _site/state/multi_asset_paper_report.json
          fi
          if [ -s research/multi_market_scan/latest.json ]; then
            mkdir -p _site/research/multi_market_scan
            cp research/multi_market_scan/latest.json _site/research/multi_market_scan/latest.json
          fi
      - name: Upload dashboard
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          name: whj-shared-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Upload shared paper audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whj-shared-paper-${{ github.run_number }}
          path: |
            dual_portfolio.json
            state/shared_paper_100usd.json
            state/shared_paper_initialized.json
            state/whj_agents.json
            office/paper_bridge_report.json
            state/multi_asset_paper_report.json
            report.json
          if-no-files-found: warn
          retention-days: 30

  deploy:
    needs: shared-paper
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: whj-shared-pages-${{ github.run_id }}-${{ github.run_attempt }}
