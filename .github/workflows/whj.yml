name: WHJ Bitcoin Bot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: whj-bitcoin-analysis
  cancel-in-progress: false

jobs:
  bitcoin-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run WHJ market analysis
        run: python main.py

      - name: Build HTML dashboard
        run: python dashboard.py

      - name: Send optional Telegram report
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py

      - name: Save analysis report and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whj-analysis-dashboard-${{ github.run_number }}
          path: |
            report.json
            dashboard.html
          if-no-files-found: ignore
          retention-days: 14
