name: WHJ Bitcoin Bot

on:
  push:
    branches: [main, build/bitcoin-satoshi-bot, research/cost-sensitivity, release/btc-volume-scanner-mainline]
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: whj-bitcoin-analysis
  cancel-in-progress: false

jobs:
  bitcoin-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore persistent paper account state
        uses: actions/cache/restore@v4
        with:
          path: paper_account_state_*.json
          key: whj-paper-portfolio-v5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whj-paper-portfolio-v5-
            whj-paper-portfolio-v4-
            whj-paper-portfolio-v3-

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run WHJ market analysis
        run: python main.py

      - name: Build HTML dashboard
        run: python dashboard.py

      - name: Prepare browser dashboard site
        run: |
          mkdir -p site
          cp web/index.html site/index.html
          cp report.json site/report.json

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard website
        if: github.ref == 'refs/heads/main' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard website
        if: github.ref == 'refs/heads/main' && steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save persistent paper account state
        if: success() && hashFiles('paper_account_state_*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: paper_account_state_*.json
          key: whj-paper-portfolio-v5-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save analysis report and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whj-analysis-dashboard-${{ github.run_number }}
          path: |
            report.json
            dashboard.html
          if-no-files-found: ignore
          retention-days: 14
