name: WHJ Bitcoin Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  bitcoin-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run WHJ Analysis
        run: python main.py