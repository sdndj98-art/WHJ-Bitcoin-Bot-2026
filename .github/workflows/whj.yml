name: WHJ Bitcoin Bot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: whj-bitcoin-analysis
  cancel-in-progress: false

jobs:
  bitcoin-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore persistent paper account state
        uses: actions/cache/restore@v4
        with:
          path: paper_account_state_*.json
          key: whj-paper-portfolio-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whj-paper-account-v1-

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run WHJ market analysis
        run: python main.py

      - name: Build HTML dashboard
        run: python dashboard.py

      - name: Save persistent paper account state
        if: success() && hashFiles('paper_account_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: paper_account_state.json
          key: whj-paper-account-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save analysis report and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whj-analysis-dashboard-${{ github.run_number }}
          path: |
            report.json
            dashboard.html
          if-no-files-found: ignore
          retention-days: 14
