name: WHJ EMA Efficiency Filter Research

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whj-ema-efficiency-research
  cancel-in-progress: false

jobs:
  isolated-ema-filter-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: feature/efficiency-ratio-indicator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test isolated ER20 research
        run: python -m unittest discover -s tests -p 'test_ema_efficiency_lab.py' -v

      - name: Run historical ER20 comparison
        run: python ema_efficiency_lab.py

      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: whj-ema-efficiency-research-${{ github.run_number }}
          path: ema_efficiency_research.json
          if-no-files-found: error
          retention-days: 30
