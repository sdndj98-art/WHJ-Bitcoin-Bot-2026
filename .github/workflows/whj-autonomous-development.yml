name: WHJ Autonomous Development Loop

on:
  workflow_dispatch:
  schedule:
    # Align with the existing 12-cycle/day office rotation.
    - cron: "0 */2 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: whj-autonomous-development
  cancel-in-progress: false

jobs:
  select-generate-test-draft-pr:
    name: Select task, generate bounded patch, test, open draft PR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify required AI secret is available
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing from repository Actions secrets."
            exit 1
          fi

      - name: Select next backlog task and create/reuse issue
        id: manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python office/autonomous_manager.py

      - name: Generate bounded Gemini patch
        if: steps.manager.outputs.has_task == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.manager.outputs.issue_number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: auto
        run: python office/ai_code_agent.py

      - name: Validate generated patch scope
        if: steps.manager.outputs.has_task == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          CHANGED="$(git diff --name-only)"
          if [ -z "$CHANGED" ]; then
            echo "::error::AI agent produced no changes."
            exit 1
          fi
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(strategy_[a-z0-9_]+\.py|shared_paper_[a-z0-9_]+\.py|paper_[a-z0-9_]+\.py|multi_market_opportunity_scan\.py|market_scanner\.py|gold_paper_runner\.py|tests/test_[a-z0-9_]+\.py|whj_[a-z0-9_]+\.py)$' | grep -q .; then
            echo "::error::Generated patch touched a path outside the source/test allowlist."
            exit 1
          fi

      - name: Compile Python
        if: steps.manager.outputs.has_task == 'true'
        run: python -m compileall -q .

      - name: Run full test suite
        if: steps.manager.outputs.has_task == 'true'
        run: python -m unittest discover -s tests -v

      - name: Create isolated branch and draft PR
        if: steps.manager.outputs.has_task == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.manager.outputs.issue_number }}
          BRANCH: ${{ steps.manager.outputs.branch }}
          TASK_TITLE: ${{ steps.manager.outputs.task_title }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -u
          git commit -m "AI office: tested proposal for issue #$ISSUE_NUMBER"
          git push origin "$BRANCH"
          gh pr create --repo "$REPOSITORY" --base main --head "$BRANCH" --draft \
            --title "$TASK_TITLE" \
            --body "Closes #$ISSUE_NUMBER\n\nGenerated by the scheduled WHJ AI development office.\n\n- Only issue-allowlisted source/test files were eligible.\n- Python compile and full unittest suite passed in this workflow.\n- Draft PR only; human review and merge required.\n- Paper-only: no exchange credentials or live orders are used.\n- No profitability claim is made."

      - name: Record no-task cycle
        if: steps.manager.outputs.has_task != 'true'
        run: echo "No eligible task was selected; no code was generated or changed."
