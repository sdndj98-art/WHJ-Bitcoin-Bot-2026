name: WHJ Five-Year Historical Strategy Research

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"
  push:
    branches: [main, build/bitcoin-satoshi-bot, research/cost-sensitivity]
    paths:
      - "historical_research.py"
      - "strategy_lab.py"
      - "paper_account.py"
      - "tests/test_historical_research.py"
      - "tests/test_simulation_regressions.py"
      - ".github/workflows/historical-research.yml"

permissions:
  contents: read

concurrency:
  group: whj-five-year-historical-research
  cancel-in-progress: false

jobs:
  five-year-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore multi-timeframe paper account state
        uses: actions/cache/restore@v4
        with:
          path: |
            paper_daily_sma20_50.json
            paper_4h_ema50_200.json
            paper_daily_bollinger.json
            paper_6h_rsi14_mean_reversion.json
          key: whj-mtf-paper-v6-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whj-mtf-paper-v6-
            whj-mtf-paper-v5-
            whj-mtf-paper-v4-

      - name: Run historical data ingestion tests
        run: python -m unittest discover -s tests -p 'test_historical_research.py' -v

      - name: Run five-year historical research
        run: python historical_research.py

      - name: Save multi-timeframe paper account state
        if: success() && hashFiles('paper_daily_sma20_50.json', 'paper_4h_ema50_200.json', 'paper_daily_bollinger.json', 'paper_6h_rsi14_mean_reversion.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            paper_daily_sma20_50.json
            paper_4h_ema50_200.json
            paper_daily_bollinger.json
            paper_6h_rsi14_mean_reversion.json
          key: whj-mtf-paper-v6-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save historical research report
        uses: actions/upload-artifact@v4
        with:
          name: whj-five-year-research-${{ github.run_number }}
          path: |
            historical_research.json
            strategy_qualification_report.md
          if-no-files-found: error
          retention-days: 30
