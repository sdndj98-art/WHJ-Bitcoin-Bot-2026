name: WHJ EMA ADX Confirmation Research

on:
  push:
    branches: [feature/efficiency-ratio-indicator]
    paths:
      - "ema_adx_lab.py"
      - "tests/test_ema_adx_lab.py"
      - "adx_walk_forward.py"
      - "tests/test_adx_walk_forward.py"
      - ".github/workflows/ema-adx-research.yml"
  pull_request:
    branches: [main]
    paths:
      - "ema_adx_lab.py"
      - "tests/test_ema_adx_lab.py"
      - ".github/workflows/ema-adx-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Isolate this research workflow by ref so a stale run on another ref
  # cannot hold the single shared queue slot indefinitely.
  group: whj-ema-adx-research-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  isolated-ema-adx-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test isolated EMA ADX research
        run: python -m unittest discover -s tests -p 'test_ema_adx_lab.py' -v

      - name: Run historical EMA ADX comparison
        run: python ema_adx_lab.py

      - name: Test expanding-window walk-forward selection
        run: python -m unittest discover -s tests -p 'test_adx_walk_forward.py' -v

      - name: Run expanding-window walk-forward research
        run: python adx_walk_forward.py

      - name: Upload ADX research report
        uses: actions/upload-artifact@v4
        with:
          name: whj-ema-adx-research-${{ github.run_number }}
          path: |
            ema_adx_research.json
            adx_walk_forward_report.json
          if-no-files-found: error
          retention-days: 30
