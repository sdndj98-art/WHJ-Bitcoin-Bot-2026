name: WHJ 24-hour Office Cycle

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whj-office-cycle
  cancel-in-progress: false

jobs:
  office-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run role rotation and handoff reminder
        run: python office/run_cycle.py
      - name: Persist handoff ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add office/office_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record office cycle handoff"
            git push
          fi
