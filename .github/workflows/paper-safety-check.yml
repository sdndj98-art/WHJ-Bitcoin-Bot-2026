name: Paper Safety Tests

on:
  push:
    branches: [research/paper-state-integrity]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paper-safety-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run paper-trading and research regression tests
        run: python -m unittest discover -s tests -v
