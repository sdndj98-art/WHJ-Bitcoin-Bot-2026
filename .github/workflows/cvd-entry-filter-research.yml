name: WHJ CVD Entry Filter Research

on:
  push:
    branches: [research/cvd-entry-filter-20261109]
    paths:
      - "cvd_entry_filter_lab.py"
      - "cvd_research_dataset.py"
      - "kraken_ohlc_export.py"
      - "tests/test_kraken_ohlc_export.py"
      - "CVD_RESEARCH_RUNBOOK.md"
      - "cvd_candle_research.py"
      - "trade_journal_checkpoint.py"
      - "tests/test_cvd_entry_filter_lab.py"
      - "tests/test_cvd_research_dataset.py"
      - ".github/workflows/cvd-entry-filter-research.yml"
  pull_request:
    branches: [main]
    paths:
      - "cvd_entry_filter_lab.py"
      - "cvd_research_dataset.py"
      - "kraken_ohlc_export.py"
      - "cvd_candle_research.py"
      - "trade_journal_checkpoint.py"
      - "tests/test_cvd_entry_filter_lab.py"
      - "tests/test_cvd_research_dataset.py"
      - "tests/test_kraken_ohlc_export.py"
      - ".github/workflows/cvd-entry-filter-research.yml"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research modules
        run: python -m py_compile cvd_entry_filter_lab.py cvd_research_dataset.py cvd_candle_research.py trade_journal_checkpoint.py kraken_ohlc_export.py
      - name: Run focused CVD research tests
        run: |
          python -m unittest discover -s tests -p "test_cvd_entry_filter_lab.py" -v
          python -m unittest discover -s tests -p "test_cvd_research_dataset.py" -v
          python -m unittest discover -s tests -p "test_kraken_ohlc_export.py" -v
