name: WHJ Isolated ADX Forward Paper

on:
  workflow_dispatch:
    inputs:
      bootstrap_ledgers:
        description: "Initialize empty ADX ledgers at the latest closed candle (first run only)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read

concurrency:
  group: whj-isolated-adx-forward-paper
  cancel-in-progress: false

jobs:
  adx-forward-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore isolated ADX ledgers
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: paper_adx_forward/
          key: whj-adx-forward-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whj-adx-forward-v1-
      - name: Refuse accidental ledger reseeding
        if: steps.restore.outputs.cache-matched-key == '' && inputs.bootstrap_ledgers != true
        run: |
          echo "::error::No prior ADX paper ledger cache. Run workflow_dispatch once with bootstrap_ledgers=true; refusing to reset or reseed."
          exit 1
      - name: Run isolated ADX safety tests
        run: python -m unittest discover -s tests -p 'test_adx_forward_paper.py' -v
      - name: Run isolated ADX forward paper
        run: python adx_forward_paper.py
      - name: Save isolated ADX ledgers
        if: success()
        uses: actions/cache/save@v4
        with:
          path: paper_adx_forward/
          key: whj-adx-forward-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish summary
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("paper_adx_forward_report.json").read_text())
          lines = [
              "## Isolated ADX forward-only paper",
              "",
              "- **Mode:** no live orders; existing paper ledgers untouched",
              "- **Data:** " + report["data_quality"],
              "- **Allocation:** " + report["allocation"],
              "",
              "| Sleeve | Return | Closed trades | PF | Max DD | Status |",
              "|---|---:|---:|---:|---:|---|",
          ]
          for name, item in report["results"].items():
              lines.append(
                  f"| {name} | {item['return_pct']:.4f}% | {item['closed_trades']} | "
                  f"{item['profit_factor']} | {item['max_drawdown_pct']:.4f}% | {item['assessment']} |"
              )
          lines += ["", "> Historical warm-up candles never create trades. Review requires at least 30 forward-closed trades per sleeve."]
          Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).write_text("\\n".join(lines) + "\\n", encoding="utf-8")
          PY
      - name: Upload isolated report
        uses: actions/upload-artifact@v4
        with:
          name: whj-isolated-adx-forward-${{ github.run_number }}
          path: paper_adx_forward_report.json
          if-no-files-found: error
          retention-days: 90
