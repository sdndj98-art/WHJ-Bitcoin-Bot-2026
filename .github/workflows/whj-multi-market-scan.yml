name: WHJ Multi-Market Opportunity Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
  push:
    branches: [main]
    paths:
      - "multi_market_opportunity_scan.py"
      - "market_scanner.py"
      - "tests/test_multi_market_opportunity_scan.py"
      - ".github/workflows/whj-multi-market-scan.yml"

permissions:
  contents: read

concurrency:
  group: whj-multi-market-opportunity-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scanner and safety tests
        run: |
          python -m py_compile multi_market_opportunity_scan.py market_scanner.py
          python -m unittest discover -s tests -p 'test_multi_market_opportunity_scan.py' -v
          python -m unittest discover -s tests -p 'test_market_scanner.py' -v
      - name: Scan all discovered liquid-quote crypto pairs and supported metals
        run: python multi_market_opportunity_scan.py
      - name: Publish scan summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("research/multi_market_scan/latest.json")
          lines = ["# WHJ multi-market opportunity scan", ""]
          if not report_path.exists():
              lines += [
                  "- **Scan report:** not generated",
                  "- **Status:** scanner failed before writing a checkpoint",
                  "- **Execution:** disabled; no live orders",
              ]
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              status = report.get("scan_status", "UNKNOWN")
              lines += [
                  f"- **Status:** {status}",
                  f"- **Generated UTC:** {report.get('generated_at_utc', 'unknown')}",
                  f"- **Crypto pairs discovered:** {report.get('crypto_pairs_discovered', 0)}",
                  f"- **Crypto pairs scanned:** {report.get('crypto_pairs_scanned', 0)}",
                  f"- **Crypto pairs remaining:** {report.get('crypto_pairs_remaining', 0)}",
                  f"- **Markets successfully scanned:** {report.get('markets_successfully_scanned', 0)}",
                  f"- **Research candidates:** {report.get('opportunity_count', 0)}",
                  f"- **Unavailable/error entries:** {len(report.get('unavailable_or_failed_markets', {}))}",
                  "- **Execution:** disabled; no orders or paper ledgers changed",
                  "",
                  "| Rank | Market | Class | Research label | Confluence |",
                  "|---:|---|---|---|---:|",
              ]
              for rank, item in enumerate(report.get("opportunities", [])[:30], 1):
                  scanner = item.get("scanner", {})
                  lines.append(
                      f"| {rank} | {item.get('symbol', '—')} | {item.get('asset_class', '—')} | "
                      f"{item.get('directional_research', 'WATCH')} | "
                      f"{scanner.get('confluence_score', '—')}/{scanner.get('confluence_total', '—')} |"
                  )
              lines += [
                  "",
                  "> Research labels only; not validated profitability claims. Coverage depends on provider availability and market listings.",
              ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload multi-market report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whj-multi-market-scan-\${{ github.run_number }}
          path: research/multi_market_scan/
          if-no-files-found: warn
          retention-days: 30
