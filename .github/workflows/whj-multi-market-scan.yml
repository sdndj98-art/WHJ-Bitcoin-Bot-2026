name: WHJ Multi-Market Opportunity Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
  push:
    branches: [main]
    paths:
      - "multi_market_opportunity_scan.py"
      - "market_scanner.py"
      - "tests/test_multi_market_opportunity_scan.py"
      - ".github/workflows/whj-multi-market-scan.yml"

permissions:
  contents: read

concurrency:
  group: whj-multi-market-opportunity-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate scanner and safety tests
        run: |
          python -m py_compile multi_market_opportunity_scan.py market_scanner.py
          python -m unittest discover -s tests -p 'test_multi_market_opportunity_scan.py' -v
          python -m unittest discover -s tests -p 'test_market_scanner.py' -v
      - name: Scan all discovered liquid-quote crypto pairs and supported metals
        run: python multi_market_opportunity_scan.py
      - name: Publish scan summary
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("research/multi_market_scan/latest.json").read_text(encoding="utf-8"))
          lines = [
              "# WHJ multi-market opportunity scan",
              "",
              f"- **Generated UTC:** {report['generated_at_utc']}",
              f"- **Crypto pairs discovered:** {report['crypto_pairs_discovered']}",
              f"- **Markets scanned:** {report['markets_successfully_scanned']}",
              f"- **Research candidates:** {report['opportunity_count']}",
              "- **Execution:** disabled; no orders or paper ledgers changed",
              "",
              "| Rank | Market | Type | Research label | Confluence |",
              "|---:|---|---|---|---:|",
          ]
          for rank, item in enumerate(report["opportunities"][:30], 1):
              scanner = item.get("scanner", {})
              lines.append(
                  f"| {rank} | {item['symbol']} | {item['asset_class']} | "
                  f"{item.get('directional_research', 'WATCH')} | "
                  f"{scanner.get('confluence_score', '—')}/{scanner.get('confluence_total', '—')} |"
              )
          lines += [
              "",
              "> The scan covers markets listed by the configured providers. It is not a guarantee that every exchange or every opportunity is covered. Signals are research-only and are not validated profitability claims.",
          ]
          Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload multi-market report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whj-multi-market-scan-\${{ github.run_number }}
          path: research/multi_market_scan/
          if-no-files-found: warn
          retention-days: 30
