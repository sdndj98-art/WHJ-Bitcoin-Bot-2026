name: WHJ Causal Regime EMA OHLC Research

on:
  workflow_dispatch:
  push:
    branches: [research/global-evidence-strategy-lab-20261112]
    paths:
      - "regime_ema_ohlc_lab.py"
      - "tests/test_regime_ema_ohlc_lab.py"
      - ".github/workflows/regime-ema-ohlc-research.yml"

permissions:
  contents: read

concurrency:
  group: whj-regime-ema-ohlc-research
  cancel-in-progress: false

jobs:
  isolated-regime-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused tests
        run: python -m unittest discover -s tests -p 'test_regime_ema_ohlc_lab.py' -v
      - name: Evaluate three chronological OOS folds
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from historical_research import load_two_year_candles
          from regime_ema_ohlc_lab import evaluate_regime_fold

          # Public Coinbase spot candles only. This script does not import or
          # invoke paper-account, monitor, wallet, exchange-order, or live code.
          candles = load_two_year_candles(days=1500)
          n = len(candles)
          if n < 1500:
              raise RuntimeError(f"Insufficient data: {n} hourly candles")
          payload = json.dumps(candles, sort_keys=True, separators=(",", ":"), allow_nan=False).encode()
          dataset_hash = hashlib.sha256(payload).hexdigest()
          cuts = [int(n * x) for x in (0.55, 0.70, 0.85, 1.0)]
          if any(cuts[i + 1] - cuts[i] < 1000 for i in range(3)):
              raise RuntimeError(f"Insufficient fold lengths: {cuts}")
          cost_levels = {"1x": (0.001, 0.0005), "2x": (0.002, 0.001), "3x": (0.003, 0.0015)}
          folds = []
          for fold_no in range(3):
              start, end = cuts[fold_no], cuts[fold_no + 1]
              item = {"fold": fold_no + 1, "oos_start_index": start, "oos_end_exclusive": end, "cost_stress": {}}
              for level, (fee, slip) in cost_levels.items():
                  item["cost_stress"][level] = evaluate_regime_fold(candles, start, end, fee, slip)
              folds.append(item)
          report = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": "Coinbase public BTC-USD hourly spot candles",
              "dataset_sha256": dataset_hash,
              "candle_count": n,
              "first_timestamp_utc": datetime.fromtimestamp(candles[0]["timestamp"] / 1000, timezone.utc).isoformat(),
              "last_timestamp_utc": datetime.fromtimestamp(candles[-1]["timestamp"] / 1000, timezone.utc).isoformat(),
              "protocol": {
                  "folds": "three consecutive, non-overlapping chronological OOS folds spanning the final 45% of observations; each fold resets to $1,000",
                  "warmup": "260 prior bars; warmup bars cannot generate OOS positions",
                  "candidates": ["EMA50/EMA200 trend", "EMA50/EMA200 plus ATR14/close <= prior 180-bar inclusive 90th percentile"],
                  "execution": "next-bar open; stop gaps fill at open; same-bar stop/target collisions stop-first",
                  "risk": "25% max allocation; fixed 2% stop and 4% target; no leverage",
                  "costs": "fee and slippage per side at 1x, 2x, and 3x",
                  "benchmarks": "cash and 25%-allocated buy-and-hold with 75% held as cash; matched OOS boundaries and costs",
                  "limitations": "fixed percentage costs do not model spread, depth, market impact, latency, or partial fills; OHLC envelope is not tick-level reconstruction",
              },
              "folds": folds,
              "promotion_status": "NO_CANDIDATE_PROMOTED",
              "live_orders": False,
              "paper_ledgers_read_or_written": False,
          }
          Path("regime_ema_ohlc_report.json").write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
          lines = [
              "# WHJ causal regime EMA OHLC research", "",
              f"- Generated UTC: {report['generated_at_utc']}",
              f"- Dataset SHA-256: `{dataset_hash}`",
              f"- BTC-USD hourly candles: {n}",
              "- Status: RESEARCH ONLY — NO CANDIDATE PROMOTED", "",
              "| Fold | Costs | Candidate | Return | Max OHLC DD | Closed trades | PF | Matched 25% buy/hold | Cash |",
              "|---:|---|---|---:|---:|---:|---:|---:|---:|",
          ]
          for fold in folds:
              for level, results in fold["cost_stress"].items():
                  for name in ("ema50_200", "ema50_200_atr90_past180"):
                      r = results[name]
                      bh = results["buy_and_hold"]["return_pct"]
                      pf = r["closed_trade_profit_factor"]
                      lines.append(f"| {fold['fold']} | {level} | {name} | {r['return_pct']:.4f}% | {r['max_intrabar_ohlc_envelope_drawdown_pct']:.4f}% | {r['closed_trades']} | {pf if pf is not None else '—'} | {bh:.4f}% | 0.0000% |")
          lines += [
              "",
              "> Buy-and-hold uses the same 25% initial capital allocation as the strategy, with 75% retained as cash. The volatility filter is a single predeclared rule, not a parameter sweep. Results are historical evidence only; three folds do not establish future profitability. No strategy is promoted. This job does not access paper ledgers or trading pathways.",
          ]
          Path("regime_ema_ohlc_report.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload isolated research report
        uses: actions/upload-artifact@v4
        with:
          name: whj-regime-ema-ohlc-${{ github.run_number }}
          path: |
            regime_ema_ohlc_report.json
            regime_ema_ohlc_report.md
          if-no-files-found: error
          retention-days: 30
